title: FrenzyPenguin Media
description: "Security hardening & privacy tools for Windows and Linux."
url: "https://frenzypenguin.media"
baseurl: ""
github_username: neohiro
github_repo: frenzypenguin-media

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "tool"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - LICENSE
  - scripts
  - "*.ps1"
  - "*.sh"
  - "github-social/"

# Jekyll silently drops any file whose name starts with "_", so _headers was
# never reaching _site and none of the security headers below were actually
# being served. This is what puts them on the wire.
include:
  - _headers